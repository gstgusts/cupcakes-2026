name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an older run of the same branch/PR when a new commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Tests create and use their own "cupcakes_test" database here
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cupcakes
          POSTGRES_PASSWORD: cupcakes
          POSTGRES_DB: cupcakes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cupcakes -d cupcakes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GitHub Container Registry

    # Database for the smoke test (same settings as docker-compose.yml)
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cupcakes
          POSTGRES_PASSWORD: cupcakes
          POSTGRES_DB: cupcakes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cupcakes -d cupcakes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Image tags: "latest" on main, branch name, short commit SHA
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      # Build once and load into the local Docker engine for testing.
      # Layers are cached in GitHub Actions between runs.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cupcakes:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start the container like Compose does: it runs the Alembic migrations, then gunicorn.
      # Keycloak is not needed for the anonymous home page.
      - name: Smoke test
        run: |
          docker run -d --name web --network host \
            -e DATABASE_URL=postgresql+psycopg://cupcakes:cupcakes@localhost:5432/cupcakes \
            -e SECRET_KEY=ci-secret \
            cupcakes:ci
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors \
            http://localhost:5000/ > /dev/null
          curl --fail --silent --show-error http://localhost:5000/static/css/app.css > /dev/null
          echo "Web app is up, migrations applied, CSS built"

      - name: Container logs
        if: always()
        run: docker logs web || true

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuses the cached layers from "Build image", so this is only an upload
      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # Example deployment to a VM (e.g. Azure) over SSH. Skipped until it is switched on:
  # Settings > Secrets and variables > Actions > Variables: DEPLOY_ENABLED = true,
  # and Secrets: VM_HOST, VM_USER, VM_SSH_KEY. See "Deployment" in README.md.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # lets the VM pull the image with this run's token
    environment:
      name: production
      url: https://cupcakes-demo.westeurope.cloudapp.azure.com # placeholder
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      # Only the compose setup is copied; the app itself comes as the Docker image from ghcr.io
      - name: Copy deployment files
        run: |
          ssh "$VM_USER@$VM_HOST" "mkdir -p ~/cupcakes"
          scp deploy/docker-compose.yml deploy/Caddyfile keycloak/realm-cupcakes.json "$VM_USER@$VM_HOST:~/cupcakes/"

      # Pulls the image of exactly this commit (tag sha-xxxxxxx from the build job) and restarts
      # what changed. Postgres and Keycloak keep their data in volumes; migrations run when web starts.
      - name: Pull and restart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The script is sent to the VM over stdin. $TOKEN, $GITHUB_ACTOR and $GITHUB_SHA are
        # filled in here on the runner before sending, so the heredoc is intentionally unquoted.
        run: |
          # shellcheck disable=SC2087
          ssh "$VM_USER@$VM_HOST" bash -s <<SCRIPT
            set -e
            cd ~/cupcakes
            echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            export IMAGE_TAG=sha-${GITHUB_SHA::7}
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
          SCRIPT
